<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boceto</title>
    <!-- Enlace al archivo CSS de Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .box { min-height: 100px; margin-bottom: 1rem; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }
        .header { background-color: #dbe9ff; }
        .aside { background-color: #7cb342; min-height: 400px; } /* Verde fuerte */
        .yellow { background-color: #fff3cd; }
        .pink { background-color: #f8d7da; }
        .green { background-color: #d1e7dd; }
        .footer { background-color: #03a9f4; }
    </style>
    
</head>
<body>

<div class="container-fluid p-0 min-vh-100 d-flex flex-column">

    <!--Zona Cabecera-->
    <div class="row g-0"> 
        <div class="col-12 header box m-0"></div> 
    </div>

    <!--Zona Cuerpo-->
    <div class="row g-0 flex-grow-1">
        
        <!--Zona Aside-->
        <div class="col-md-3 col-lg-2 d-none d-md-block aside"></div>

        <!--Zona Cabecera-->
        <div class="col-12 col-md-9 col-lg-10 p-3 d-flex flex-column">
            
            <!--Zona Amarilla-->
            <div class="row g-0 mb-3">
                <div class="col-12">
                    <div class="yellow box"></div>
                </div>
            </div>

            <!--Zona interna rosa y verde claro-->
            <div class="d-flex flex-column flex-grow-1">
                <!--Zona Rosa-->
                <div class="row g-3 flex-grow-1 mb-3">
                    <div class="col-6 col-lg-3"><div class="pink box h-100"></div></div>
                    <div class="col-6 col-lg-3"><div class="pink box h-100"></div></div>
                    <div class="col-6 col-lg-3"><div class="pink box h-100"></div></div>
                    <div class="col-6 col-lg-3"><div class="pink box h-100"></div></div>
                </div>
                <!--Zona Verde-->
                <div class="row g-3 flex-grow-1">
                    <div class="col-12 col-lg-6"><div class="green box h-100"></div></div>
                    <div class="col-12 col-lg-6"><div class="green box h-100"></div></div>
                </div>
            </div>

        </div>
    </div>

    <!--Zona Footer-->
    <div class="row g-0">
        <div class="col-12 footer box m-0"></div>
    </div>

</div>

</div>

</div>
    <!-- Enlace a los archivos JavaScript de Bootstrap 5 y Popper en un solo archivo (bootstrap.bundle.min.js) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>



</html>
